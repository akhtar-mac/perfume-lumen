name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, admin, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: apps/${{ matrix.app }}

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: apps/${{ matrix.app }}

      - name: Lint
        run: npm run lint --if-present
        working-directory: apps/${{ matrix.app }}

      - name: Build
        run: npm run build
        working-directory: apps/${{ matrix.app }}

  test:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      matrix:
        app: [frontend, admin, backend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: apps/${{ matrix.app }}

      - name: Test
        run: npm test --if-present
        working-directory: apps/${{ matrix.app }}

  # Deploy is disabled until Phase 0 secret rotation is confirmed complete.
