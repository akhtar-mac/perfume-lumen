name: Deploy Vyan Fragrances
on:
  push:
    branches: [ main ]
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      # Add deployment steps below depending on the hosting provider (e.g., AWS S3, Vercel, Netlify)
      # - name: Deploy
      #   run: echo "Deploying..."
